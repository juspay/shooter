name: Release and Publish

on:
  push:
    branches:
      - release

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write # Required for npm provenance

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm i

      - name: Build package
        run: pnpm run build

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
      id-token: write # Required for OIDC authentication with npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build package
        run: pnpm run build

      - name: Release with semantic-release
        run: npx semantic-release@25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'

      - name: Setup Node for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@juspay'

      # Publish only what isn't on the registry yet. Release-less commits
      # (docs/chore/ci all map to `release: false`) would otherwise re-publish the
      # current version and fail with a 409, turning `release` red. Probing the
      # registry rather than diffing the version keeps a rerun able to publish a
      # version whose earlier publish attempt failed.
      - name: Publish to GitHub Packages
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@juspay/shooter@${version}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@juspay/shooter@${version} is already on GitHub Packages — nothing to publish."
          else
            echo "Publishing ${version} to GitHub Packages..."
            pnpm publish --access public --no-git-checks --registry https://npm.pkg.github.com
            echo "Published ${version} to GitHub Packages successfully!"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
